<style>

.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}
.top .code{font-size:30px;line-height:1;background:var(--lime);border:3px solid var(--ink);border-radius:14px;padding:4px 12px;box-shadow:3px 3px 0 var(--ink);display:inline-block;margin-top:4px;letter-spacing:.12em}
.meta{font-size:11px;color:var(--mut);letter-spacing:.16em;text-transform:uppercase;font-weight:900}
.linkbox{font-size:13px;font-weight:700;word-break:break-all;color:var(--purple);border:3px dashed var(--purple);background:#f3edff;border-radius:14px;padding:12px}
.players{list-style:none}
.players li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:2px dashed #e6defa;font-weight:800}

.players li:nth-child(6n+2) .av{background:var(--pink);color:#fff}.players li:nth-child(6n+3) .av{background:var(--cyan)}.players li:nth-child(6n+4) .av{background:var(--lime)}.players li:nth-child(6n+5) .av{background:var(--orange)}.players li:nth-child(6n) .av{background:var(--purple);color:#fff}

.tag{font-size:10px;color:var(--ink);background:#ffe9a8;border-radius:999px;padding:2px 8px;letter-spacing:.08em;text-transform:uppercase;margin-left:6px;font-weight:900}

.x{background:#fff;border:2.5px solid var(--ink);border-radius:50%;width:30px;height:30px;color:var(--ink);font-size:16px;font-weight:900;cursor:pointer;line-height:1}
.stage{perspective:1000px}

.reveal:before{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);animation:shine 3s ease-in-out infinite;pointer-events:none;z-index:1}

.reveal>*{position:relative;z-index:2}

.reveal .big{font-size:clamp(36px,11vw,58px);line-height:1.05;word-break:break-word;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.reveal .hint{color:var(--ink);background:rgba(255,255,255,.75);border-radius:999px;padding:4px 12px}

.reveal .emoji{animation:fl 2.2s ease-in-out infinite}
.reveal.imp .emoji{animation:wob 1.1s ease-in-out infinite}

.hint{color:var(--mut);font-size:12px;margin-top:14px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.mini{display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:linear-gradient(90deg,#fff 0%,#fff6c9 100%)}
.mini b{font-family:'Fredoka',sans-serif;font-size:19px;color:var(--purple)}
.turn{text-align:center;padding:22px 12px;background:linear-gradient(180deg,#fff 0%,#ffeef6 100%)}
.turn .big{font-size:clamp(32px,9vw,46px);line-height:1.1}
.clues{list-style:none}
.clues li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:2px dashed #e6defa;font-size:15px;font-weight:700}
.clues li:last-child{border:none}
.clues .c{font-weight:900;text-align:right;color:#fff;background:var(--purple);border-radius:10px;padding:1px 10px}
.clues .c .muted,.clues .c:has(.muted){background:none}
.muted{color:var(--mut)!important;font-style:italic;font-weight:600}
.order{display:flex;flex-wrap:wrap;gap:6px}
.order span{font-size:12px;font-weight:800;border:2.5px solid var(--ink);border-radius:999px;padding:4px 11px;background:#fff}
.order span.now{background:var(--pink);color:#fff;animation:ring 1.2s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,61,139,.7)}100%{box-shadow:0 0 0 12px rgba(255,61,139,0)}}
.order span.done{background:#e8f9ea;opacity:.7}

.vote button{padding:18px 10px;border-radius:18px;border:3px solid var(--ink);background:#fff;color:var(--ink);font-family:'Fredoka',sans-serif;font-size:18px;font-weight:600;cursor:pointer;word-break:break-word;box-shadow:4px 4px 0 var(--ink);transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .2s}
.vote button:nth-child(4n+1){background:#e3f9ff}.vote button:nth-child(4n+2){background:#fff3c4}.vote button:nth-child(4n+3){background:#e5fbe7}.vote button:nth-child(4n){background:#ffe3ef}

.vote button.sel{background:var(--pink)!important;color:#fff;transform:scale(1.05) rotate(-2deg)}

.chatbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;background:var(--cyan);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:18px;padding:12px 18px;font-family:'Fredoka',sans-serif;font-size:16px;font-weight:700;cursor:pointer}

#voiceBar button.talk{box-shadow:0 0 0 5px var(--lime),4px 4px 0 var(--ink)}
.av.talk{box-shadow:0 0 0 4px var(--lime),0 0 14px 4px var(--lime);transform:scale(1.08)}
.vic{font-size:14px;margin-left:6px}
.dz{background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:2px 6px;font-size:14px;cursor:pointer;margin-left:4px}
.dz.on{background:var(--pink)}
@media (prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="voiceBar" class="hidden"></div>
<button id="chatBtn" class="chatbtn hidden">CHAT<span id="unread"></span></button>
<div id="chat" class="chat hidden">
  <div class="chathead"><span>💬 Room chat</span><button class="x" id="chatClose">×</button></div>
  <div id="chatLog"></div>
  <form id="chatForm"><input id="chatIn" maxlength="200" placeholder="Say something…" autocomplete="off"><button type="submit">SEND</button></form>
</div>

};
const CATS = Object.keys(WORDS);

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, Number.isFinite(v) ? v : a));
const clone = o => JSON.parse(JSON.stringify(o));
const norm = s => String(s || '').toLowerCase().replace(/^the\s+/, '').replace(/[^a-z0-9]/g, '').replace(/(es|s)$/, '');
const genCode = () => { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += c[rnd(c.length)]; return s; };

const token = sessionStorage.getItem('imp_token') || (() => {
  const t = 'p' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  sessionStorage.setItem('imp_token', t); return t;
})();

const urlRoom = (new URLSearchParams(location.search).get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const App = {
  screen: 'home', name: localStorage.getItem('imp_name') || '', code: urlRoom, fromLink: !!urlRoom,
  isHost: false, peer: null, conn: null, S: null, role: null,
  revealed: false, myVote: null, lastRound: 0, status: '',
  chatOpen: false, chatSeen: 0, lastSeen: 0, pingT: null, viewKey: '', flipAnim: false
};
let H = null;

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }
const roomLink = code => `${location.origin}${location.pathname}?room=${code}`;

/* =========================================================
   NETWORK — host
   ========================================================= */
function createRoom() {
  const name = getName(); if (!name) return;
  if (typeof Peer === 'undefined') return fail('Could not load the networking library. Check your internet and reload.');
  cleanup();
  App.screen = 'connecting'; App.status = ''; render();
  const code = genCode();
  const peer = new Peer(PREFIX + code, PEER_OPTS);
  App.peer = peer;
  peer.on('open', () => {
    App.isHost = true; App.code = code; App.fromLink = false;
    hostInit(code, name);
    history.replaceState(null, '', '?room=' + code);
    App.screen = 'game';
    hostBroadcast();
  });
  peer.on('connection', hostOnConn);
  peer.on('call', onIncomingCall);
  peer.on('disconnected', () => { if (App.peer === peer && !peer.destroyed) setTimeout(() => { try { peer.reconnect(); } catch (e) {} }, 1500); });
  peer.on('error', e => {
    if (App.peer !== peer) return;
    if (e.type === 'unavailable-id') { createRoom(); return; }
    if (!App.isHost) fail('Could not create room (' + e.type + '). Try again.');
    else if (e.type !== 'peer-unavailable') toast('Network: ' + e.type);
  });
}

function hostInit(code, name) {
  H = {
    conns: {}, lastSeen: {}, secret: null, roles: {}, votes: {}, used: new Set(), guess: null, impCount: {}, lastImps: [],
    pub: {
      code, hostId: token, phase: 'lobby', roundNum: 0, round: null, chat: [],
      players: [{ id: token, name, score: 0, online: true, peerId: PREFIX + code, voice: false, vmuted: false }],
      settings: { category: 'all', imposters: 1, clueRounds: 2, hint: true }
    }
  };
  H.timer = setInterval(hostTick, 4000);
}

function hostOnConn(conn) {
  conn.on('data', d => hostData(conn, d));
  conn.on('close', () => { const id = conn._pid; if (H && id && H.conns[id] === conn) { delete H.conns[id]; setOnline(id, false); } });
  conn.on('error', () => {});
}

function hostData(conn, m) {
  if (!H || !m || typeof m !== 'object') return;
  const P = H.pub;
  if (m.t === 'join') {
    const id = String(m.token || '').slice(0, 40);
    if (!id || id === P.hostId) return;
    let p = findP(id);
    if (!p) {
      if (P.players.length >= MAX_PLAYERS) { try { conn.send({ t: 'error', msg: 'Room is full.' }); } catch (e) {} setTimeout(() => conn.close(), 500); return; }
      p = { id, name: uniqueName(String(m.name || '').trim().slice(0, 16) || 'Player'), score: 0, online: true };
      P.players.push(p);
      sysChat(`${p.name} joined ✨`);
    } else if (!p.online) { p.online = true; sysChat(`${p.name} reconnected`); }
    p.peerId = String(m.pid || '').slice(0, 80); p.voice = false; p.vmuted = false;
    const old = H.conns[id];
    H.conns[id] = conn; conn._pid = id; H.lastSeen[id] = Date.now();
    if (old && old !== conn) { try { old.close(); } catch (e) {} }
    sendTo(id, { t: 'role', r: H.roles[id] || null });
    hostBroadcast();
    return;
  }
  const id = conn._pid;
  if (!id || H.conns[id] !== conn) return;
  H.lastSeen[id] = Date.now();
  if (m.t === 'ping') {
    try { conn.send({ t: 'pong' }); } catch (e) {}
    const p = findP(id); if (p && !p.online) { p.online = true; hostBroadcast(); }
    return;
  }
  act(id, m);
}

function hostTick() {
  if (!H) return;
  let changed = false; const now = Date.now();
  H.pub.players.forEach(p => {
    if (p.id === H.pub.hostId) return;
    if (p.online && now - (H.lastSeen[p.id] || 0) > 15000) { p.online = false; changed = true; sysChat(`${p.name} disconnected`); }
  });
  if (changed) { checkProgress(); hostBroadcast(); }
}

function sendTo(id, msg) {
  if (!H) return;
  if (id === H.pub.hostId) { onMsg(clone(msg)); return; }
  const c = H.conns[id];
  if (c && c.open) { try { c.send(msg); } catch (e) {} }
}
function hostBroadcast() { if (H) H.pub.players.forEach(p => sendTo(p.id, { t: 'state', s: H.pub })); }
function sendRoles() { H.pub.players.forEach(p => sendTo(p.id, { t: 'role', r: H.roles[p.id] || null })); }

const findP = id => H.pub.players.find(p => p.id === id);
const nameOf = id => (H ? findP(id) : (App.S && App.S.players.find(p => p.id === id)))?.name || '???';
const isOnline = id => !!(findP(id) || {}).online;
function uniqueName(n) { let name = n, i = 2; while (H.pub.players.some(p => p.name.toLowerCase() === name.toLowerCase())) name = `${n} ${i++}`; return name; }
function sysChat(text) { H.pub.chat.push({ sys: true, text, ts: Date.now() }); if (H.pub.chat.length > 50) H.pub.chat.splice(0, H.pub.chat.length - 50); }
function setOnline(id, v) { const p = findP(id); if (!p || p.online === v) return; p.online = v; if (!v) sysChat(`${p.name} disconnected`); checkProgress(); hostBroadcast(); }

/* ---------- game logic (host only) ---------- */
function act(id, m) {
  const P = H.pub, R = P.round, isH = id === P.hostId, p = findP(id);
  if (!p) return;
  switch (m.t) {
    case 'chat': {
      const text = String(m.text || '').trim().slice(0, 200); if (!text) return;
      P.chat.push({ n: p.name, id, text, ts: Date.now() });
      if (P.chat.length > 50) P.chat.splice(0, P.chat.length - 50);
      break;
    }
    case 'settings': {
      if (!isH || P.phase !== 'lobby') return;
      const s = P.settings, v = m.s || {};
      if (v.category && (v.category === 'all' || WORDS[v.category])) s.category = v.category;
      if (v.imposters != null) s.imposters = clamp(+v.imposters, 1, 3);
      if (v.clueRounds != null) s.clueRounds = clamp(+v.clueRounds, 1, 3);
      if (v.hint != null) s.hint = v.hint === true || v.hint === 'yes';
      break;
    }
    case 'kick': {
      if (!isH || m.id === P.hostId || !['lobby', 'results'].includes(P.phase)) return;
      const i = P.players.findIndex(x => x.id === m.id); if (i < 0) return;
      const [k] = P.players.splice(i, 1);
      sendTo(k.id, { t: 'kicked' });
      const c = H.conns[k.id]; delete H.conns[k.id];
      setTimeout(() => { try { c && c.close(); } catch (e) {} }, 400);
      sysChat(`${k.name} was removed`);
      break;
    }
    case 'start': if (!isH || !['lobby', 'results'].includes(P.phase)) return; startRound(); return;
    case 'lobby': if (!isH) return; P.phase = 'lobby'; P.round = null; H.roles = {}; H.secret = null; sendRoles(); break;
    case 'ready':
      if (P.phase !== 'reveal' || !R.order.includes(id)) return;
      if (!R.ready.includes(id)) R.ready.push(id);
      checkProgress(); break;
    case 'forceClues': if (!isH || P.phase !== 'reveal') return; toClues(); break;
    case 'clue': {
      if (P.phase !== 'clues' || curTurn(R) !== id) return;
      R.clues.push({ id, text: String(m.text || '').trim().slice(0, 40), r: clueRoundNo(R) });
      R.turn++; advanceTurn(); break;
    }
    case 'skipTurn':
      if (!isH || P.phase !== 'clues') return;
      R.clues.push({ id: curTurn(R), text: '', skipped: true, r: clueRoundNo(R) });
      R.turn++; advanceTurn(); break;
    case 'vote':
      if (P.phase !== 'voting' || !R.order.includes(id) || !R.order.includes(m.target) || m.target === id) return;
      H.votes[id] = m.target; R.voted = Object.keys(H.votes);
      checkProgress(); break;
    case 'endVote': if (!isH || P.phase !== 'voting') return; tally(); break;
    case 'guess': {
      if (P.phase !== 'guess' || R.ejected !== id) return;
      const g = String(m.text || '').trim().slice(0, 40); if (!g) return;
      H.guess = g;
      const ok = norm(g) === norm(H.secret.word);
      finish(ok, ok ? `${p.name} was caught… but guessed it right!` : `${p.name} was caught and guessed “${g}” — wrong!`);
      return;
    }
    case 'skipGuess': if (!isH || P.phase !== 'guess') return; finish(false, `${nameOf(R.ejected)} was caught and didn't guess in time.`); return;
    case 'accept': {
      if (!isH || P.phase !== 'results' || !R.result || !R.result.guess) return;
      applyScore(R.result.impWin, -1);
      R.result.impWin = !R.result.impWin;
      R.result.reason = R.result.impWin ? `Host accepted the guess “${R.result.guess}” — the imposter steals the win!` : `Host rejected the guess “${R.result.guess}”.`;
      applyScore(R.result.impWin, 1);
      break;
    }
    case 'voice': p.voice = !!m.on; p.vmuted = !!m.muted; if (m.on && m.join) sysChat(`${p.name} joined voice 🎙️`); break;
    default: return;
  }
  hostBroadcast();
}

/* Fair imposter rotation:
   1) never repeat last round's imposter(s) when there are enough other players
   2) prefer players who have been imposter the fewest times
   3) random among equals */
function pickImposters(order, nImp) {
  const cnt = H.impCount;
  const known = order.filter(id => cnt[id] != null).map(id => cnt[id]);
  const base = known.length ? Math.min(...known) : 0;
  order.forEach(id => { if (cnt[id] == null) cnt[id] = base; }); // new joiners start level
  let pool = order.filter(id => !H.lastImps.includes(id));
  if (pool.length < nImp) pool = order.slice();
  const picked = [];
  while (picked.length < nImp) {
    const left = pool.filter(id => !picked.includes(id));
    const min = Math.min(...left.map(id => cnt[id]));
    const best = left.filter(id => cnt[id] === min);
    picked.push(best[rnd(best.length)]);
  }
  picked.forEach(id => cnt[id]++);
  H.lastImps = picked.slice();
  return picked;
}
function startRound() {
  const P = H.pub, s = P.settings;
  const players = P.players.filter(p => p.online);
  if (players.length < 3) { sendTo(P.hostId, { t: 'error', msg: 'Need at least 3 players online' }); return; }
  const cat = s.category === 'all' ? CATS[rnd(CATS.length)] : s.category;
  let pool = WORDS[cat].filter(w => !H.used.has(w));
  if (!pool.length) { WORDS[cat].forEach(w => H.used.delete(w)); pool = WORDS[cat].slice(); }
  const word = pool[rnd(pool.length)]; H.used.add(word);
  const order = shuffle(players.map(p => p.id));
  const nImp = Math.min(s.imposters, Math.max(1, Math.floor((order.length - 1) / 2)));
  const imps = pickImposters(order, nImp);
  H.secret = { word, category: cat, imposters: imps };
  H.votes = {}; H.guess = null; H.roles = {};
  P.roundNum++;
  P.round = { num: P.roundNum, order, nImp, ready: [], turn: 0, clues: [], voted: [], ejected: null, counts: null, result: null };
  order.forEach(id => {
    H.roles[id] = imps.includes(id)
      ? { imp: true, category: s.hint ? cat : null, partners: imps.filter(x => x !== id).map(nameOf) }
      : { imp: false, word, category: cat };
  });
  P.phase = 'reveal';
  sendRoles(); hostBroadcast();
}

const curTurn = R => R.order[R.turn % R.order.length];
const clueRoundNo = R => Math.floor(R.turn / R.order.length) + 1;

function toClues() { const R = H.pub.round; H.pub.phase = 'clues'; R.turn = 0; advanceTurn(); }
function advanceTurn() {
  const P = H.pub, R = P.round, total = R.order.length * P.settings.clueRounds;
  let guard = 0;
  while (R.turn < total && !isOnline(curTurn(R)) && guard++ < 200) R.turn++;
  if (R.turn >= total) { P.phase = 'voting'; H.votes = {}; R.voted = []; checkProgress(); }
}
function checkProgress() {
  const P = H.pub, R = P.round; if (!R) return;
  const live = R.order.filter(isOnline);
  if (P.phase === 'reveal' && live.length && live.every(x => R.ready.includes(x))) toClues();
  else if (P.phase === 'clues' && !isOnline(curTurn(R))) advanceTurn();
  else if (P.phase === 'voting' && live.length && live.every(x => H.votes[x])) tally();
}
function tally() {
  const P = H.pub, R = P.round, counts = {};
  Object.values(H.votes).forEach(t => counts[t] = (counts[t] || 0) + 1);
  let max = 0, top = [];
  for (const [k, v] of Object.entries(counts)) { if (v > max) { max = v; top = [k]; } else if (v === max) top.push(k); }
  R.counts = counts;
  if (top.length !== 1) return finish(true, max ? 'Tie vote — nobody was voted out.' : 'Nobody voted.');
  const ej = top[0]; R.ejected = ej;
  if (H.secret.imposters.includes(ej)) { P.phase = 'guess'; hostBroadcast(); }
  else finish(true, `${nameOf(ej)} was innocent!`);
}
function finish(impWin, reason) {
  const P = H.pub, R = P.round;
  P.phase = 'results';
  R.result = { impWin, reason, word: H.secret.word, category: H.secret.category, imposters: H.secret.imposters, votes: { ...H.votes }, guess: H.guess };
  applyScore(impWin, 1);
  hostBroadcast();
}
function applyScore(impWin, sign) {
  const R = H.pub.round, imps = H.secret.imposters;
  H.pub.players.forEach(p => {
    if (!R.order.includes(p.id)) return;
    const isImp = imps.includes(p.id);
    if (impWin && isImp) p.score += 2 * sign;
    if (!impWin && !isImp) p.score += 1 * sign;
  });
}

/* =========================================================
   NETWORK — player
   ========================================================= */
function joinRoom() {
  const name = getName(); if (!name) return;
  const code = (App.code || '').trim().toUpperCase();
  if (code.length < 4) { toast('Enter a room code'); return; }
  if (typeof Peer === 'undefined') return fail('Could not load the networking library. Check your internet and reload.');
  cleanup();
  App.code = code; App.screen = 'connecting'; App.status = ''; render();
  const peer = new Peer(PEER_OPTS);
  App.peer = peer;
  peer.on('call', onIncomingCall);
  const timeout = setTimeout(() => { if (App.peer === peer && App.screen === 'connecting') fail('Could not reach the room. Check the code — the host may have closed it, or your network blocks peer connections.'); }, 20000);
  peer.on('open', () => {
    const conn = peer.connect(PREFIX + code, { reliable: true, serialization: 'json' });
    App.conn = conn;
    conn.on('open', () => {
      clearTimeout(timeout);
      conn.send({ t: 'join', token, name, pid: peer.id });
      App.lastSeen = Date.now();
      history.replaceState(null, '', '?room=' + code);
      clearInterval(App.pingT);
      App.pingT = setInterval(() => {
        if (App.conn !== conn) return;
        if (conn.open) { try { conn.send({ t: 'ping' }); } catch (e) {} }
        if (Date.now() - App.lastSeen > 20000) lost(conn);
      }, 4000);
    });
    conn.on('data', d => { if (App.conn === conn) { App.lastSeen = Date.now(); onMsg(d); } });
    conn.on('close', () => lost(conn));
    conn.on('error', () => lost(conn));
  });
  peer.on('error', e => {
    if (App.peer !== peer) return;
    clearTimeout(timeout);
    if (e.type === 'peer-unavailable') fail(`Room ${code} not found. It may have ended — ask the host for a new link.`);
    else if (App.screen === 'connecting') fail('Connection error: ' + e.type);
  });
}

function lost(conn) {
  if (conn && App.conn !== conn) return;
  if (App.screen !== 'game' && App.screen !== 'connecting') return;
  clearInterval(App.pingT);
  App.screen = 'lost'; render();
}

function send(m) {
  if (App.isHost && H) act(token, m);
  else if (App.conn && App.conn.open) { try { App.conn.send(m); } catch (e) { toast('Not connected'); } }
  else toast('Not connected');
}

function onMsg(m) {
  if (!m || typeof m !== 'object') return;
  switch (m.t) {
    case 'state': {
      const S = m.s;
      const rn = S.round ? S.round.num : 0;
      if (rn !== App.lastRound) { App.lastRound = rn; App.revealed = false; App.myVote = null; }
      if (S.phase === 'results' && (!App.S || App.S.phase !== 'results')) confetti(S.round.result.impWin ? ['😈', '💜', '🔥', '⭐', '💥'] : ['🏆', '🎉', '⭐', '🥳', '🎈', '🍭']);
      App.S = S;
      if (App.screen === 'connecting' || App.screen === 'lost') App.screen = 'game';
      render(); syncVoice(); break;
    }
    case 'role': App.role = m.r; if (App.S) render(); break;
    case 'kicked': cleanup(); goHome('You were removed from the room by the host.'); break;
    case 'closed': cleanup(); goHome('The host closed the room.'); break;
    case 'error': toast(m.msg); break;
  }
}

function cleanup() {
  voiceStop(true);
  clearInterval(App.pingT);
  if (H) clearInterval(H.timer);
  const p = App.peer;
  App.peer = null; App.conn = null; App.S = null; App.role = null; App.isHost = false; H = null;
  App.lastRound = 0; App.revealed = false; App.myVote = null; App.chatOpen = false; App.chatSeen = 0;
  if (p) setTimeout(() => { try { p.destroy(); } catch (e) {} }, 400);
}
function goHome(status) {
  history.replaceState(null, '', location.pathname);
  App.screen = 'home'; App.status = status || ''; App.fromLink = false; App.code = '';
  render();
}
function fail(msg) { cleanup(); App.screen = 'home'; App.status = msg; render(); }
function leave() {
  if (App.isHost && H) H.pub.players.forEach(p => { if (p.id !== token) sendTo(p.id, { t: 'closed' }); });
  cleanup(); goHome('');
}
function getName() {
  const el = $('#name'); if (el) App.name = el.value;
  const n = (App.name || '').trim().slice(0, 16);
  if (!n) { toast('Enter your name first'); el && el.focus(); return null; }
  localStorage.setItem('imp_name', n); App.name = n; return n;
}

/* =========================================================
   VIEWS
   ========================================================= */
function view() {
  if (App.screen === 'connecting') return vConnecting();
  if (App.screen === 'lost') return vLost();
  if (App.screen === 'game' && App.S) return vGame();
  return vHome();
}

const vHow = () => `<div class="card how"><div class="label">How to play</div><ol>
<li>Everyone gets the <b>same secret word</b> — except the <b class="r">imposter</b> 😈.</li>
<li>Take turns giving <b>one-word clues</b> ✨. Prove you know it without giving it away.</li>
<li>The imposter bluffs and tries to blend in.</li>
<li><b>Vote</b> out who you think is faking. A caught imposter gets <b>one guess</b> at the word to steal the win.</li></ol>
<p class="mt">Crew wins: +1 each · Imposter wins: +2</p></div>`;

function vHome() {
  return `<div class="castle float">🕵️</div><h1 class="logo dot">${[...'IMPOSTER'].map(c => `<span>${c}</span>`).join('')}</h1>
  <p class="sub">one of you is lying</p>
  <div class="card"><div class="label">Your name</div><input id="name" maxlength="16" placeholder="e.g. Jaya" value="${esc(App.name)}" autocomplete="off"></div>
  ${App.fromLink
    ? `<button class="btn red" data-a="join">✨ Join room ${esc(App.code)}</button>
       <button class="btn ghost mt" data-a="create">Create a new room instead</button>`
    : `<button class="btn" data-a="create">✨ Create room</button>
       <div class="or">or join with a code</div>

const vConnecting = () => `<div class="castle float">🚀</div><h1 class="logo dot" style="font-size:40px">Connecting…</h1><p class="sub">${App.code ? 'room ' + esc(App.code) : 'creating room'}</p>

function vTop(S) {

function vPlayers(S, opts = {}) {
  const meHost = S.hostId === token;

function vGame() {

  else if (S.phase === 'results') body = vResults(S, isHost);
  else if (!inRound) body = vSpectator(S);

function vClueList(S) {
  const R = S.round, rounds = S.settings.clueRounds;

  return out;
}

/* ---------- render + chat ---------- */
function render() {
  const a = document.activeElement;
  const keep = a && a.id && a.tagName === 'INPUT' && a.closest('#app') ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null;
  const vals = {}; document.querySelectorAll('#app input[id]').forEach(i => vals[i.id] = i.value);
  // entrance animation only when screen/phase changes (not on every network update)
  const key = App.screen + '|' + (App.S ? App.S.phase + (App.S.round ? App.S.round.num : '') : '');
  const appEl = $('#app');
  appEl.classList.toggle('enter', key !== App.viewKey); App.viewKey = key;
  appEl.innerHTML = view();
  if (App.flipAnim) { const rv = document.querySelector('.reveal'); if (rv) rv.classList.add('flipin'); App.flipAnim = false; }
  for (const id in vals) { const el = document.getElementById(id); if (el && id !== 'name' && id !== 'code') el.value = vals[id]; }
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch (e) {} } }
  renderChat();
}

function renderChat() {
  renderVoice();
  const show = App.screen === 'game' && App.S;
  $('#chatBtn').classList.toggle('hidden', !show || App.chatOpen);
  $('#chat').classList.toggle('hidden', !show || !App.chatOpen);
  if (!show) return;
  const chat = App.S.chat || [];
  const lastTs = chat.length ? chat[chat.length - 1].ts : 0;
  if (App.chatOpen) App.chatSeen = lastTs;
  const unread = chat.filter(c => c.ts > App.chatSeen && !c.sys && c.id !== token).length;
  $('#unread').innerHTML = unread ? `<span class="u">${unread}</span>` : '';
  const log = $('#chatLog');
  if (log.dataset.ts !== String(lastTs) + chat.length) {
    log.dataset.ts = String(lastTs) + chat.length;
    log.innerHTML = chat.map(c => c.sys ? `<div class="m sys">${esc(c.text)}</div>` : `<div class="m"><b class="${c.id === token ? 'r' : ''}">${esc(c.n)}</b>${esc(c.text)}</div>`).join('') || '<div class="m sys">No messages yet</div>';
    log.scrollTop = log.scrollHeight;
  }
}

/* =========================================================
   VOICE CHAT — WebRTC audio mesh via PeerJS (no server)
   ========================================================= */
const V = { on: false, stream: null, muted: false, calls: {}, els: {}, deaf: {}, ctx: null, an: {}, loop: null, tick: 0, busy: false };
async function voiceJoin() {
  if (V.on || V.busy || !App.peer || !App.S) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('Voice needs HTTPS (GitHub Pages is fine)'); return; }
  V.busy = true;
  try {
    V.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) { V.busy = false; toast('🎙️ Mic blocked — allow microphone access'); return; }
  V.busy = false; V.on = true; V.muted = false;
  try { V.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  watchLevel(token, V.stream);
  V.loop = setInterval(voiceLoop, 150);
  send({ t: 'voice', on: true, muted: false, join: true });
  render(); syncVoice();
  toast('🎙️ You joined voice');
}
function voiceStop(silent) {
  if (!V.on && !V.stream) return;
  Object.keys(V.calls).forEach(dropCall);
  Object.keys(V.els).forEach(dropCall);
  if (V.stream) V.stream.getTracks().forEach(t => t.stop());
  clearInterval(V.loop);
  if (V.ctx) { try { V.ctx.close(); } catch (e) {} }
  Object.assign(V, { on: false, stream: null, muted: false, ctx: null, an: {}, loop: null });
  if (!silent) { send({ t: 'voice', on: false }); render(); toast('Left voice'); }
}
function voiceMute() {
  if (!V.on) return;
  V.muted = !V.muted;
  V.stream.getAudioTracks().forEach(t => t.enabled = !V.muted);
  send({ t: 'voice', on: true, muted: V.muted });
  renderVoice();
}
function dropCall(pid) {
  const c = V.calls[pid];
  delete V.calls[pid];
  if (c) { try { c.call.close(); } catch (e) {} }
  const el = V.els[pid];
  if (el) { el.srcObject = null; el.remove(); }
  delete V.els[pid]; delete V.an[pid];
}
function attachCall(pid, call) {
  if (!call) return;
  V.calls[pid] = { call, peerId: call.peer, at: Date.now() };
  call.on('stream', st => {
    let el = V.els[pid];
    if (!el) { el = document.createElement('audio'); el.autoplay = true; el.setAttribute('playsinline', ''); document.body.appendChild(el); V.els[pid] = el; }
    el.srcObject = st; el.muted = !!V.deaf[pid];
    el.play().catch(() => toast('Tap anywhere to hear voice'));
    watchLevel(pid, st);
  });
  const end = () => { if (V.calls[pid] && V.calls[pid].call === call) dropCall(pid); };
  call.on('close', end); call.on('error', end);
}
// lower peer-id side places the call, so each pair connects exactly once
function syncVoice() {
  if (!V.on || !App.S || !App.peer || !App.peer.id) return;
  const me = App.peer.id, want = {};
  App.S.players.forEach(p => { if (p.id !== token && p.online && p.voice && p.peerId) want[p.id] = p.peerId; });
  Object.keys(V.calls).forEach(pid => { if (want[pid] !== V.calls[pid].peerId) dropCall(pid); });
  for (const [pid, peerId] of Object.entries(want)) {
    const c = V.calls[pid];
    if (c && !V.els[pid] && Date.now() - c.at > 12000) dropCall(pid); // retry stuck calls
    if (!V.calls[pid] && me < peerId) {
      try { attachCall(pid, App.peer.call(peerId, V.stream, { metadata: { from: token } })); } catch (e) {}
    }
  }
}
function onIncomingCall(call) {
  const from = call.metadata && call.metadata.from;
  if (!V.on || !from) { try { call.close(); } catch (e) {} return; }
  if (V.calls[from]) dropCall(from);
  call.answer(V.stream);
  attachCall(from, call);
}
function watchLevel(pid, st) {
  if (!V.ctx) return;
  try {
    const an = V.ctx.createAnalyser(); an.fftSize = 256;
    V.ctx.createMediaStreamSource(st).connect(an);
    V.an[pid] = { an, buf: new Uint8Array(an.fftSize) };
  } catch (e) {}
}
function voiceLoop() {
  if (V.ctx && V.ctx.state === 'suspended') V.ctx.resume().catch(() => {});
  const talk = new Set();
  for (const [pid, o] of Object.entries(V.an)) {
    o.an.getByteTimeDomainData(o.buf);
    let m = 0; for (let i = 0; i < o.buf.length; i++) { const d = Math.abs(o.buf[i] - 128); if (d > m) m = d; }
    if (m > 12 && !(pid === token && V.muted) && !V.deaf[pid]) talk.add(pid);
  }
  document.querySelectorAll('[data-vp]').forEach(e => e.classList.toggle('talk', talk.has(e.dataset.vp)));
  const mb = document.getElementById('vMuteBtn'); if (mb) mb.classList.toggle('talk', talk.has(token));
  if (++V.tick % 20 === 0) syncVoice();
}
function renderVoice() {
  const bar = $('#voiceBar');
  const show = App.screen === 'game' && App.S && !App.chatOpen;
  bar.classList.toggle('hidden', !show);
  if (!show) return;
  const n = App.S.players.filter(p => p.online && p.voice).length;
  bar.innerHTML = V.on
    ? `<button id="vMuteBtn" class="${V.muted ? 'mut' : ''}" data-a="vmute">${V.muted ? '🔇 Unmute' : '🎙️ Mute'}</button><button class="lv" data-a="vleave">📞 Leave</button>`
    : `<button data-a="vjoin">🎙️ Join voice${n ? ` (${n})` : ''}</button>`;
}
document.addEventListener('click', () => { Object.values(V.els).forEach(el => { if (el.paused) el.play().catch(() => {}); }); });
/* ---------- effects ---------- */
function confetti(set) {
  for (let i = 0; i < 40; i++) {
    const e = document.createElement('div'); e.className = 'spark';
    e.textContent = set[rnd(set.length)];
    e.style.left = Math.random() * 100 + 'vw';
    e.style.fontSize = 16 + rnd(18) + 'px';
    e.style.animationDuration = 2.2 + Math.random() * 2 + 's';
    e.style.animationDelay = Math.random() * .8 + 's';
    document.body.appendChild(e); setTimeout(() => e.remove(), 5200);
  }
}
function motes() {
  for (let i = 0; i < 14; i++) {
    const m = document.createElement('div'); m.className = 'mote';
    m.style.left = Math.random() * 100 + 'vw';
    m.style.animationDuration = 12 + Math.random() * 14 + 's';
    m.style.animationDelay = -Math.random() * 20 + 's';
    const z = 10 + rnd(14); m.style.width = m.style.height = z + 'px';
    document.body.appendChild(m);
  }
}

/* ---------- events ---------- */
const actions = {
  create: createRoom, join: joinRoom,
  home: () => { cleanup(); goHome(''); },
  leave: () => { if (confirm(App.isHost ? 'Leave and close the room for everyone?' : 'Leave the room?')) leave(); },
  copy: () => {
    const link = roomLink(App.S.code);
    (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast('✨ Link copied — send it to your friends'))
      .catch(() => prompt('Copy this link:', link));
  },
  share: () => navigator.share({ title: 'Imposter', text: 'Join my Imposter game! ✨', url: roomLink(App.S.code) }).catch(() => {}),
  start: () => send({ t: 'start' }),
  lobby: () => send({ t: 'lobby' }),
  flip: () => { App.revealed = !App.revealed; App.flipAnim = true; render(); },
  ready: () => { App.revealed = false; send({ t: 'ready' }); },
  forceClues: () => send({ t: 'forceClues' }),
  clue: () => {
    const i = $('#clue'), v = i ? i.value.trim() : '';
    if (!v) { toast('Type a clue, or tap “Said it aloud”'); return; }
    if (App.role && !App.role.imp && norm(v) === norm(App.role.word)) { toast('You can’t say the word itself!'); return; }
    i.value = ''; send({ t: 'clue', text: v });
  },
  aloud: () => send({ t: 'clue', text: '' }),
  skipTurn: () => send({ t: 'skipTurn' }),
  pick: el => { App.myVote = el.dataset.id; render(); },
  vote: () => { if (App.myVote) send({ t: 'vote', target: App.myVote }); },
  endVote: () => { if (confirm('End voting now and count current votes?')) send({ t: 'endVote' }); },
  guess: () => { const i = $('#guess'), v = i ? i.value.trim() : ''; if (!v) { toast('Type your guess'); return; } send({ t: 'guess', text: v }); },
  skipGuess: () => send({ t: 'skipGuess' }),
  accept: () => send({ t: 'accept' }),
  vjoin: () => voiceJoin(),
  vmute: () => voiceMute(),
  vleave: () => voiceStop(false),
  deaf: el => { const id = el.dataset.id; V.deaf[id] = !V.deaf[id]; if (V.els[id]) V.els[id].muted = V.deaf[id]; render(); },
  kick: el => { if (confirm('Remove ' + nameOf(el.dataset.id) + '?')) send({ t: 'kick', id: el.dataset.id }); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (el && !el.disabled && actions[el.dataset.a]) actions[el.dataset.a](el);
});
document.addEventListener('input', e => {
  if (e.target.id === 'name') App.name = e.target.value;
  if (e.target.id === 'code') { e.target.value = e.target.value.toUpperCase(); App.code = e.target.value; }
});
document.addEventListener('change', e => {
  const m = e.target.id && e.target.id.match(/^set-(\w+)$/);
  if (m) send({ t: 'settings', s: { [m[1]]: e.target.value } });
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const id = e.target.id;
  if (id === 'name') (App.fromLink ? joinRoom : createRoom)();
  else if (id === 'code') joinRoom();
  else if (id === 'clue') actions.clue();
  else if (id === 'guess') actions.guess();
});
$('#chatBtn').onclick = () => { App.chatOpen = true; renderChat(); setTimeout(() => $('#chatIn').focus(), 50); };
$('#chatClose').onclick = () => { App.chatOpen = false; renderChat(); };
$('#chatForm').onsubmit = e => { e.preventDefault(); const i = $('#chatIn'), v = i.value.trim(); if (!v) return; i.value = ''; send({ t: 'chat', text: v }); };
window.addEventListener('beforeunload', e => { if (App.isHost && H && H.pub.players.length > 1) { e.preventDefault(); e.returnValue = ''; } });

motes();
render();
</script>
</body>
</html>
